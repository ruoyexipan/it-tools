aboutPage:
  content: >
    # Об IT-Tools

    Этот замечательный сайт, созданный с ❤ [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), объединяет полезные инструменты для разработчиков и IT-специалистов. Если вам он полезен, поделитесь с теми, кому он тоже может пригодиться, и не забудьте добавить в закладки!

    IT Tools — проект с открытым исходным кодом (лицензия GPL-3.0) и бесплатный, и таким останется навсегда, однако хостинг и продление домена стоят денег. Если вы хотите поддержать мою работу и мотивировать добавлять новые инструменты, рассмотрите возможность [спонсировать меня](https://www.buymeacoffee.com/cthmsst).

    ## Технологии

    IT Tools создан на Vue.js (Vue 3) с библиотекой компонентов Naive UI и развёрнут с помощью Vercel. В некоторых инструментах используются сторонние библиотеки с открытым исходным кодом — полный список можно найти в файле [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) репозитория.

    ## Нашли ошибку? Не хватает инструмента?

    Если вам нужен инструмент, которого здесь нет, и вы считаете его полезным, добро пожаловать в [раздел issues](https://github.com/CorentinTh/it-tools/issues/new/choose) репозитория на GitHub — оставьте запрос на добавление функции.

    А если вы нашли ошибку или что-то работает не так, как ожидалось, сообщите об этом в [разделе issues](https://github.com/CorentinTh/it-tools/issues/new/choose) репозитория на GitHub.

