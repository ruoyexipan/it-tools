aboutPage:
  content: >
    # Informazioni su IT-Tools

    Questo meraviglioso sito web, realizzato con ❤ da [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), raccoglie strumenti utili per sviluppatori e professionisti IT. Se lo trovi utile, sentiti libero di condividerlo con chi pensi possa trovarlo utile e non dimenticare di aggiungerlo ai tuoi preferiti!

    IT Tools è open-source (sotto licenza GPL-3.0) e gratuito, e lo sarà sempre, ma mi costa denario ospitare e rinnovare il nome a dominio. Se vuoi supportare il mio lavoro e incoraggiarmi ad aggiungere più strumenti, considera di supportarmi [offrendomi un caffè](https://www.buymeacoffee.com/cthmsst).

    ## Tecnologie

    IT Tools è realizzato con Vue.js (Vue 3) e la libreria di componenti Naive UI, ed è ospitato e distribuito continuamente da Vercel. Alcuni strumenti utilizzano librerie open-source di terze parti; puoi trovare l'elenco completo nel file [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) del repository.

    ## Hai trovato un bug? Manca uno strumento?

    Se hai bisogno di uno strumento che attualmente non è presente qui e pensi che possa essere utile, sei il benvenuto a inviare una richiesta nella [sezione issues](https://github.com/CorentinTh/it-files/issues/new/choose) del repository GitHub.

    E se hai trovato un bug, o qualcosa non funziona come previsto, invia una segnalazione nella [sezione issues](https://github.com/CorentinTh/it-tools/issues/new/choose) del repository GitHub.

