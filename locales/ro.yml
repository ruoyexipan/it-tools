aboutPage:
  content: >
    # Despre IT-Tools

    Acest site web minunat, creat cu ❤ de [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), adună instrumente utile pentru dezvoltatori și persoane care lucrează în IT. Dacă îl consideri util, te rugăm să îl distribui persoanelor care crezi că ar putea găsi util și nu uita să îl adaugi la marcaje în bara de scurtături!

    IT Tools este open-source (sub licența GPL-3.0) și gratuit, și va fi întotdeauna, dar costă bani pentru găzduire și reînnoirea numelui de domeniu. Dacă vrei să susții munca mea și să mă încurajezi să adaug mai multe instrumente, te rog să iei în considerare susținerea prin [sponsorizare](https://www.buymeacoffee.com/cthmsst).

    ## Tehnologii

    IT Tools este realizat în Vue.js (Vue 3) cu biblioteca de componente Naive UI și este găzduit și implementat continuu de Vercel. Biblioteci open-source terțe sunt utilizate în unele instrumente, poți găsi lista completă în fișierul [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) al repository-ului.

    ## Ai găsit un bug? Lipsește un instrument?

    Dacă ai nevoie de un instrument care nu este prezent aici și crezi că poate fi util, ești binevenit să trimiți o cerere de funcționalitate în [secțiunea de issues](https://github.com/CorentinTh/it-tools/issues/new/choose) din repository-ul GitHub.

    Și dacă ai găsit un bug sau ceva nu funcționează așa cum era de așteptat, te rugăm să trimiți un raport de eroare în [secțiunea de issues](https://github.com/CorentinTh/it-tools/issues/new/choose) din repository-ul GitHub.

