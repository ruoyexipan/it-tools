  otp-generator:
    title: Генератор OTP-кодів
    description: Генеруйте та валідуйте одноразові паролі (OTP) на основі часу для багатофакторної автентифікації.

  url-encoder:
    title: Кодування/декодування URL-форматованих рядків
    description: Кодуйте текст у формат URL-кодування (також відомий як «відсоткове кодування») або декодуйте з нього.

  text-to-binary:
    title: Текст у двійковий ASCII
    description: Конвертуйте текст у його двійкове представлення ASCII і навпаки.

  unix-timestamp-converter:
    title: Конвертер Unix-мітки часу
    description: Конвертуйте Unix-мітки часу у зрозумілі дати і навпаки. Підтримує секунди та мілісекунди.

  speed-test:
    title: Тест швидкості інтернету
    description: Перевірте швидкість вашого інтернет-з'єднання онлайн. Виміряйте швидкість завантаження, вивантаження та затримку ping.

  dns-lookup:
    title: DNS-запити
    description: Перевіряйте DNS-записи для будь-якого домену. Перевіряйте записи A, AAAA, MX, TXT, CNAME та NS онлайн.

  ssl-checker:
    title: Перевірка SSL-сертифіката
    description: Перевіряйте деталі SSL-сертифіката для будь-якого вебсайту. Перевіряйте дійсність сертифіката, дату закінчення та інформацію про видавця.

  website-checker:
    title: Перевірка доступності сайту
    description: Перевірте, чи працює вебсайт. Тестуйте доступність сайту з різних місць по всьому світу.

  my-ip:
    title: Яка моя IP-адреса
    description: Перевірте вашу публічну IP-адресу онлайн. Безкоштовний інструмент пошуку IP-адреси, що показує вашу IP, розташування та інформацію про провайдера.

