aboutPage:
  content: >
    # Om IT-Tools

    Denna fantastiska webbplats, gjord med ❤ av [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), samlar användbara verktyg för utvecklare och personer som arbetar med IT. Om du tycker den är användbar, dela den gärna med personer du tror kan ha nytta av den och glöm inte att bokmärka den i din genvägsfält!

    IT Tools är open-source (under GPL-3.0-licensen) och gratis, och kommer alltid att vara det, men det kostar mig pengar att drifta och förnya domännamnet. Om du vill stödja mitt arbete och uppmuntra mig att lägga till fler verktyg, överväg gärna att stödja genom att [sponsra mig](https://www.buymeacoffee.com/cthmsst).

    ## Teknologier

    IT Tools är gjort i Vue.js (Vue 3) med Naive UI-komponentbiblioteket och driftas och distribueras kontinuerligt av Vercel. Tredjeparts open-source-bibliotek används i vissa verktyg, du hittar den fullständiga listan i [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json)-filen i arkivet.

    ## Hittat en bugg? Saknas ett verktyg?

    Om du behöver ett verktyg som för närvarande inte finns här och du tycker det kan vara användbart, är du välkommen att skicka en funktionsförfrågan i [issues-sektionen](https://github.com/CorentinTh/it-tools/issues/new/choose) i GitHub-arkivet.

    Och om du hittade en bugg eller något inte fungerar som förväntat, vänligen skicka in en buggrapport i [issues-sektionen](https://github.com/CorentinTh/it-tools/issues/new/choose) i GitHub-arkivet.

