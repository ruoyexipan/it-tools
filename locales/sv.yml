  token-generator:
    title: Token-generator
    description: Generera slumpmässiga strängar med de tecken du vill ha, versaler eller gemener, siffror och/eller symboler.

    uppercase: Versaler (ABC...)
    lowercase: Gemener (abc...)
    numbers: Siffror (123...)
    symbols: Symboler (!-;...)
    length: Längd
    tokenPlaceholder: 'Token...'
    copied: Token kopierad till urklipp
