  password-strength-analyser:
    title: Lösenordsstyrkeanalysator
    description: Upptäck styrkan i ditt lösenord med denna klientbaserade lösenordsstyrkeanalysator och beräkningsverktyg för knäckningstid.

  chronometer:
    title: Kronometer
