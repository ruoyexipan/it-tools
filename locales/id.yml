aboutPage:
  content: >
    # Tentang IT-Tools

    Situs web luar biasa ini, dibuat dengan ❤ oleh [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), mengumpulkan alat-alat berguna untuk pengembang dan orang-orang yang bekerja di bidang IT. Jika Anda merasa bermanfaat, silakan bagikan kepada orang yang menurut Anda juga akan merasakan manfaatnya dan jangan lupa untuk menandainya di bilah pintasan Anda!

    IT Tools bersifat open-source (di bawah lisensi GPL-3.0) dan gratis, dan akan selalu demikian, tetapi saya membutuhkan biaya untuk hosting dan memperbarui nama domain. Jika Anda ingin mendukung pekerjaan saya, dan mendorong saya untuk menambahkan lebih banyak alat, silakan pertimbangkan untuk mendukung dengan [mensponsori saya](https://www.buymeacoffee.com/cthmsst).

    ## Teknologi

    IT Tools dibuat dengan Vue.js (Vue 3) menggunakan pustaka komponen Naive UI dan di-hosting serta di-deploy secara berkelanjutan oleh Vercel. Pustaka open-source pihak ketiga digunakan di beberapa alat, Anda dapat menemukan daftar lengkapnya di file [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) di repositori.

    ## Menemukan bug? Ada alat yang kurang?

    Jika Anda membutuhkan alat yang saat ini belum tersedia di sini, dan menurut Anda alat tersebut bermanfaat, Anda dipersilakan untuk mengirimkan permintaan fitur di [bagian issues](https://github.com/CorentinTh/it-tools/issues/new/choose) di repositori GitHub.

    Dan jika Anda menemukan bug, atau sesuatu tidak berfungsi sebagaimana mestinya, silakan laporkan bug di [bagian issues](https://github.com/CorentinTh/it-tools/issues/new/choose) di repositori GitHub.

