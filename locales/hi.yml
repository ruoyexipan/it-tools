  user-agent-parser:
    title: यूज़र-एजेंट पार्सर
    description: यूज़र-एजेंट स्ट्रिंग से ब्राउज़र, इंजन, OS, CPU, और डिवाइस प्रकार/मॉडल का पता लगाएं और पार्स करें।

  numeronym-generator:
