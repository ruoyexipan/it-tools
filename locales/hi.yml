    title: MAC पता लुकअप
    description: MAC पते द्वारा किसी डिवाइस के विक्रेता और निर्माता का पता लगाएं।

  mime-types:
    title: MIME प्रकार
    description: MIME प्रकारों को फ़ाइल एक्सटेंशन में और इसके विपरीत कनवर्ट करें।

  toml-to-json:
    title: TOML से JSON
    description: TOML को पार्स करें और JSON में कनवर्ट करें।

  lorem-ipsum-generator:
    title: Lorem ipsum जनरेटर
    description: Lorem ipsum एक प्लेसहोल्डर टेक्स्ट है जिसका उपयोग सामान्य रूप से सार्थक सामग्री पर निर्भर किए बिना किसी दस्तावेज़ या टाइपफेस के दृश्य रूप को प्रदर्शित करने के लिए किया जाता है।

  qrcode-generator:
    title: QR कोड जनरेटर
    description: किसी URL (या सादे टेक्स्ट) के लिए QR कोड उत्पन्न करें और डाउनलोड करें, और पृष्ठभूमि और अग्रभूमि रंगों को अनुकूलित करें।

  wifi-qrcode-generator:
    title: WiFi QR कोड जनरेटर
    description: WiFi नेटवर्क से त्वरित कनेक्शन के लिए QR कोड उत्पन्न करें और डाउनलोड करें।

  xml-formatter:
    title: XML फ़ॉर्मेटर
    description: अपनी XML स्ट्रिंग को मैत्रीपूर्ण, मानव-पठनीय प्रारूप में सुंदर बनाएं।

  temperature-converter:
    title: तापमान कनवर्टर
    description: केल्विन, सेल्सियस, फ़ारेनहाइट, रैंकिन, डेलिसल, न्यूटन, रिओमूर और रोमर के लिए डिग्री तापमान रूपांतरण।

  chmod-calculator:
    title: Chmod कैलकुलेटर
    description: इस ऑनलाइन chmod कैलकुलेटर के साथ अपनी chmod अनुमतियों और कमांड की गणना करें।

  rsa-key-pair-generator:
    title: RSA कुंजी जोड़ी जनरेटर
    description: एक नई यादृच्छिक RSA निजी और सार्वजनिक PEM प्रमाणपत्र कुंजी जोड़ी उत्पन्न करें।

  html-wysiwyg-editor:
    title: HTML WYSIWYG संपादक
    description: ऑनलाइन, सुविधा-संपन्न WYSIWYG HTML संपादक जो सामग्री का स्रोत कोड तुरंत उत्पन्न करता है।

  yaml-to-toml:
    title: YAML से TOML
    description: YAML को पार्स करें और TOML में कनवर्ट करें।

  mac-address-generator:
    title: MAC पता जनरेटर
    description: मात्रा और उपसर्ग दर्ज करें। MAC पते आपके चुने हुए केस (बड़े या छोटे अक्षरों) में उत्पन्न किए जाएंगे।

  json-diff:
    title: JSON अंतर
    description: दो JSON ऑब्जेक्ट की तुलना करें और उनके बीच का अंतर प्राप्त करें।

  jwt-parser:
    title: JWT पार्सर
    description: अपने JSON वेब टोकन (JWT) को पार्स और डिकोड करें और इसकी सामग्री प्रदर्शित करें।

  date-converter:
    title: दिनांक-समय कनवर्टर
    description: दिनांक और समय को विभिन्न प्रारूपों में कनवर्ट करें

  phone-parser-and-formatter:
    title: फ़ोन पार्सर और फ़ॉर्मेटर
    description: फ़ोन नंबर पार्स, सत्यापित और फ़ॉर्मेट करें। फ़ोन नंबर के बारे में जानकारी प्राप्त करें, जैसे देश कोड, प्रकार, आदि।

  ipv4-subnet-calculator:
    title: IPv4 सबनेट कैलकुलेटर
    description: अपने IPv4 CIDR ब्लॉक को पार्स करें और अपने सबनेट के बारे में आवश्यक सभी जानकारी प्राप्त करें।

  og-meta-generator:
    title: Open Graph मेटा जनरेटर
    description: अपनी वेबसाइट के लिए Open Graph और सोशल HTML मेटा टैग उत्पन्न करें।

  ipv6-ula-generator:
    title: IPv6 ULA जनरेटर
    description: RFC4193 के अनुसार अपने नेटवर्क के लिए अपना स्थानीय, गैर-रूटेबल IP पता उत्पन्न करें।

  hash-text:
    title: हैश टेक्स्ट
    description: 'अपनी आवश्यकता के अनुसार फ़ंक्शन का उपयोग करके टेक्स्ट स्ट्रिंग को हैश करें: MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 या RIPEMD160'

  json-to-toml:
    title: JSON से TOML
    description: JSON को पार्स करें और TOML में कनवर्ट करें।

  device-information:
    title: डिवाइस जानकारी
    description: अपने वर्तमान डिवाइस के बारे में जानकारी प्राप्त करें (स्क्रीन आकार, पिक्सेल-अनुपात, यूज़र एजेंट, ...)

  pdf-signature-checker:
    title: PDF हस्ताक्षर जांचकर्ता
    description: PDF फ़ाइल के हस्ताक्षरों को सत्यापित करें। एक हस्ताक्षरित PDF फ़ाइल में एक या अधिक हस्ताक्षर होते हैं जिनका उपयोग यह निर्धारित करने के लिए किया जा सकता है कि फ़ाइल पर हस्ताक्षर किए जाने के बाद से फ़ाइल की सामग्री बदली गई है या नहीं।

  json-minify:
    title: JSON मिनिफाई
    description: अनावश्यक व्हाइटस्पेस हटाकर अपने JSON को मिनिफाई और संपीड़ित करें।

  ulid-generator:
    title: ULID जनरेटर
    description: यादृच्छिक सार्वभौमिक रूप से अद्वितीय शाब्दिक रूप से क्रमबद्ध करने योग्य पहचानकर्ता (ULID) उत्पन्न करें।

  string-obfuscator:
    title: स्ट्रिंग ऑब्स्क्यूकेटर
    description: स्ट्रिंग (जैसे रहस्य, IBAN, या टोकन) को साझा करने योग्य और पहचानने योग्य बनाने के लिए ऑब्स्क्यूकेट करें बिना इसकी सामग्री प्रकट किए।

  base-converter:
    title: पूर्णांक आधार कनवर्टर
    description: एक संख्या को विभिन्न आधारों (दशमलव, हेक्साडेसिमल, बाइनरी, ऑक्टल, base64, ...) के बीच कनवर्ट करें।

  yaml-to-json-converter:
    title: YAML से JSON कनवर्टर
    description: इस ऑनलाइन लाइव कनवर्टर के साथ सरलता से YAML को JSON में कनवर्ट करें।

  uuid-generator:
    title: UUID जनरेटर
    description: सार्वभौमिक रूप से अद्वितीय पहचानकर्ता (UUID) कंप्यूटर सिस्टम में जानकारी की पहचान करने के लिए उपयोग की जाने वाली 128-बिट संख्या है। संभावित UUID की संख्या 16^32 है, जो 2^128 या लगभग 3.4x10^38 है (जो बहुत अधिक है!)।

  ipv4-address-converter:
    title: IPv4 पता कनवर्टर
    description: एक IP पते को दशमलव, बाइनरी, हेक्साडेसिमल, या यहाँ तक कि IPv6 प्रतिनिधित्व में कनवर्ट करें।

  text-statistics:
    title: टेक्स्ट सांख्यिकी
    description: टेक्स्ट के बारे में जानकारी प्राप्त करें, अक्षरों की संख्या, शब्दों की संख्या, बाइट्स में इसका आकार, ...

  text-to-nato-alphabet:
    title: टेक्स्ट से NATO वर्णमाला
    description: मौखिक प्रसारण के लिए टेक्स्ट को NATO ध्वन्यात्मक वर्णमाला में बदलें।

  basic-auth-generator:
    title: बेसिक ऑथ जनरेटर
    description: उपयोगकर्ता नाम और पासवर्ड से base64 बेसिक ऑथ हेडर उत्पन्न करें।

  text-to-unicode:
    title: टेक्स्ट से यूनिकोड
    description: टेक्स्ट को यूनिकोड में पार्स और कनवर्ट करें और इसके विपरीत

  ipv4-range-expander:
    title: IPv4 रेंज एक्सपेंडर
    description: एक प्रारंभ और अंत IPv4 पते के आधार पर, यह उपकरण इसके CIDR नोटेशन के साथ एक मान्य IPv4 सबनेट की गणना करता है।

  text-diff:
    title: टेक्स्ट अंतर
    description: दो टेक्स्ट की तुलना करें और उनके बीच का अंतर देखें।

  otp-generator:
    title: OTP कोड जनरेटर
    description: मल्टी-फैक्टर प्रमाणीकरण के लिए समय-आधारित OTP (वन टाइम पासवर्ड) उत्पन्न करें और सत्यापित करें।

  url-encoder:
    title: URL-प्रारूपित स्ट्रिंग एन्कोड/डिकोड करें
    description: टेक्स्ट को URL-एन्कोडेड प्रारूप में एन्कोड करें (जिसे "प्रतिशत-एन्कोडेड" भी कहा जाता है), या इससे डिकोड करें।

  text-to-binary:
    title: टेक्स्ट से ASCII बाइनरी
    description: टेक्स्ट को उसके ASCII बाइनरी प्रतिनिधित्व में और इसके विपरीत कनवर्ट करें।

  unix-timestamp-converter:
    title: Unix टाइमस्टैम्प कनवर्टर
    description: Unix टाइमस्टैम्प को मानव-पठनीय तिथियों में और इसके विपरीत कनवर्ट करें। सेकंड और मिलीसेकंड का समर्थन करता है।

  speed-test:
    title: इंटरनेट स्पीड टेस्ट
    description: अपनी इंटरनेट कनेक्शन गति ऑनलाइन परीक्षण करें। डाउनलोड गति, अपलोड गति और पिंग विलंबता मापें।

  dns-lookup:
    title: DNS लुकअप
    description: किसी भी डोमेन के लिए DNS रिकॉर्ड देखें। A, AAAA, MX, TXT, CNAME और NS रिकॉर्ड ऑनलाइन जांचें।

  ssl-checker:
    title: SSL प्रमाणपत्र जांचकर्ता
    description: किसी भी वेबसाइट के लिए SSL प्रमाणपत्र विवरण जांचें। प्रमाणपत्र वैधता, समाप्ति तिथि और जारीकर्ता जानकारी सत्यापित करें।

  website-checker:
    title: वेबसाइट डाउन चेकर
    description: जांचें कि कोई वेबसाइट डाउन है या अप। दुनिया भर के कई स्थानों से वेबसाइट उपलब्धता परीक्षण करें।

  my-ip:
    title: मेरा IP पता क्या है
    description: अपना सार्वजनिक IP पता ऑनलाइन जांचें। आपका IP, स्थान और ISP जानकारी दिखाने वाला मुफ्त IP पता लुकअप उपकरण।

