  json-prettify:
    title: JSON सुंदर बनाएं और फ़ॉर्मेट करें
    description: अपनी JSON स्ट्रिंग को मैत्रीपूर्ण, मानव-पठनीय प्रारूप में सुंदर बनाएं।

  docker-run-to-docker-compose-converter:
    title: Docker run से Docker compose कनवर्टर
    description: 'docker run कमांड को docker-compose फ़ाइलों में बदलता है!'

