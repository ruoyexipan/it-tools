  password-strength-analyser:
    title: पासवर्ड शक्ति विश्लेषक
    description: इस क्लाइंट-साइड-ओनली पासवर्ड शक्ति विश्लेषक और क्रैक समय अनुमान उपकरण के साथ अपने पासवर्ड की शक्ति जानें।

