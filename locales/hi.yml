  json-to-yaml-converter:
    title: JSON से YAML कनवर्टर
    description: इस ऑनलाइन लाइव कनवर्टर के साथ सरलता से JSON को YAML में कनवर्ट करें।

  url-parser:
    title: URL पार्सर
    description: एक URL को उसके अलग-अलग घटक भागों (प्रोटोकॉल, उत्पत्ति, पैराम, पोर्ट, उपयोगकर्ता नाम-पासवर्ड, ...) में पार्स करें।

  iban-validator-and-parser:
    title: IBAN सत्यापनकर्ता और पार्सर
