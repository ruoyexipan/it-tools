aboutPage:
  content: >
    # IT-Tools के बारे में

    यह शानदार वेबसाइट, जो [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) द्वारा ❤ से बनाई गई है, डेवलपर्स और IT में काम करने वाले लोगों के लिए उपयोगी उपकरण प्रदान करती है। यदि आपको यह उपयोगी लगे, तो कृपया इसे उन लोगों के साथ साझा करें जिन्हें यह उपयोगी लग सकता है और इसे अपने शॉर्टकट बार में बुकमार्क करना न भूलें!

    IT Tools ओपन-सोर्स (GPL-3.0 लाइसेंस के तहत) और मुफ्त है, और हमेशा रहेगा, लेकिन होस्टिंग और डोमेन नाम नवीनीकरण में मुझे खर्च आता है। यदि आप मेरे काम का समर्थन करना चाहते हैं, और मुझे अधिक उपकरण जोड़ने के लिए प्रोत्साहित करना चाहते हैं, तो कृपया [मुझे प्रायोजित करके](https://www.buymeacoffee.com/cthmsst) समर्थन करने पर विचार करें।

    ## तकनीकें

    IT Tools Vue.js (Vue 3) के साथ Naive UI कंपोनेंट लाइब्रेरी के साथ बनाया गया है और Vercel द्वारा होस्ट और निरंतर तैनात किया गया है। कुछ उपकरणों में थर्ड-पार्टी ओपन-सोर्स लाइब्रेरी का उपयोग किया जाता है, आप रिपॉज़िटरी के [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) फ़ाइल में पूरी सूची पा सकते हैं।

    ## बग मिला? कोई उपकरण गायब है?

    यदि आपको किसी ऐसे उपकरण की आवश्यकता है जो वर्तमान में यहाँ मौजूद नहीं है, और आपको लगता है कि यह उपयोगी हो सकता है, तो आप GitHub रिपॉज़िटरी में [issues सेक्शन](https://github.com/CorentinTh/it-tools/issues/new/choose) में एक फीचर रिक्वेस्ट सबमिट करने के लिए स्वागत हैं।

    और यदि आपको कोई बग मिला है, या कुछ अपेक्षा के अनुसार काम नहीं कर रहा है, तो कृपया GitHub रिपॉज़िटरी में [issues सेक्शन](https://github.com/CorentinTh/it-tools/issues/new/choose) में बग रिपोर्ट दर्ज करें।

