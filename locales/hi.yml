  random-port-generator:
    title: यादृच्छिक पोर्ट जनरेटर
    description: 'known पोर्ट (0-1023) की सीमा से बाहर यादृच्छिक पोर्ट नंबर उत्पन्न करें।'

  yaml-prettify:
    title: YAML सुंदर बनाएं और फ़ॉर्मेट करें
    description: अपनी YAML स्ट्रिंग को मैत्रीपूर्ण, मानव-पठनीय प्रारूप में सुंदर बनाएं।

  eta-calculator:
    title: ETA कैलकुलेटर
    description: एक ETA (अनुमानित आगमन समय) कैलकुलेटर जो किसी कार्य का अनुमानित समाप्ति समय निर्धारित करता है, उदाहरण के लिए, फ़ाइल डाउनलोड का समाप्ति समय और अवधि।

  roman-numeral-converter:
    title: रोमन अंक कनवर्टर
    description: रोमन अंकों को संख्याओं में कनवर्ट करें और संख्याओं को रोमन अंकों में कनवर्ट करें।

  hmac-generator:
    title: HMAC जनरेटर
    description: एक गुप्त कुंजी और आपके पसंदीदा हैशिंग फ़ंक्शन का उपयोग करके हैश-आधारित संदेश प्रमाणीकरण कोड (HMAC) की गणना करें।

  bip39-generator:
    title: BIP39 पासफ़्रेज़ जनरेटर
    description: मौजूदा या यादृच्छिक स्मरण-सहायक से BIP39 पासफ़्रेज़ उत्पन्न करें, या पासफ़्रेज़ से स्मरण-सहायक प्राप्त करें।

  base64-file-converter:
    title: Base64 फ़ाइल कनवर्टर
    description: एक स्ट्रिंग, फ़ाइल, या छवि को उसके base64 प्रतिनिधित्व में कनवर्ट करें।

  list-converter:
    title: सूची कनवर्टर
    description: यह उपकरण कॉलम-आधारित डेटा को संसाधित कर सकता है और प्रत्येक पंक्ति पर विभिन्न परिवर्तन (ट्रांसपोज़, उपसर्ग और प्रत्यय जोड़ें, सूची उलटें, सूची क्रमबद्ध करें, मान छोटे अक्षरों में, मान छोटे करें) लागू कर सकता है।

  base64-string-converter:
    title: Base64 स्ट्रिंग एन्कोडर/डिकोडर
    description: स्ट्रिंग को उनके base64 प्रतिनिधित्व में सरलता से एन्कोड और डिकोड करें।

  toml-to-yaml:
    title: TOML से YAML
    description: TOML को पार्स करें और YAML में कनवर्ट करें।

  math-evaluator:
