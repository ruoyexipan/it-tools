  slugify-string:
    title: स्लगिफाई स्ट्रिंग
    description: एक स्ट्रिंग को URL, फ़ाइल नाम और ID के लिए सुरक्षित बनाएं।

  encryption:
    title: टेक्स्ट एन्क्रिप्ट / डिक्रिप्ट करें
