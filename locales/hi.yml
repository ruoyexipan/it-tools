      refresh: रिफ्रेश करें
  percentage-calculator:
    title: प्रतिशत कैलकुलेटर
    description: एक मान से दूसरे मान तक, या एक प्रतिशत से मान तक प्रतिशत आसानी से गणना करें।

  svg-placeholder-generator:
    title: SVG प्लेसहोल्डर जनरेटर
    description: अपने एप्लिकेशन में प्लेसहोल्डर के रूप में उपयोग करने के लिए SVG छवियाँ उत्पन्न करें।

  json-to-csv:
    title: JSON से CSV
    description: स्वचालित हेडर पहचान के साथ JSON को CSV में कनवर्ट करें।

  camera-recorder:
    title: कैमरा रिकॉर्डर
    description: अपने वेबकैम या कैमरे से तस्वीर लें या वीडियो रिकॉर्ड करें।

  keycode-info:
    title: कीकोड जानकारी
    description: किसी भी दबाए गए कुंजी का जावास्क्रिप्ट कीकोड, कोड, स्थान और मॉडिफायर खोजें।

  emoji-picker:
    title: इमोजी पिकर
    description: इमोजी को आसानी से कॉपी और पेस्ट करें और प्रत्येक इमोजी का यूनिकोड और कोड पॉइंट मान प्राप्त करें।

  color-converter:
    title: रंग कनवर्टर
    description: विभिन्न प्रारूपों (hex, rgb, hsl और css नाम) के बीच रंग कनवर्ट करें

