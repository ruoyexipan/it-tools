    description: اختبر سرعة اتصالك بالإنترنت عبر الإنترنت. اقيس سرعة التنزيل وسرعة التحميل وزمن الاستجابة.

  dns-lookup:
    title: بحث DNS
    description: ابحث عن سجلات DNS لأي نطاق. تحقق من سجلات A وAAAA وMX وTXT وCNAME وNS عبر الإنترنت.

