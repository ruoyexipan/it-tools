aboutPage:
  content: >
    # حول IT-Tools

    هذا الموقع الرائع، صنعه بـ ❤ [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about)، يجمع أدوات مفيدة للمطورين و专业人士 في مجال تكنولوجيا المعلومات. إذا وجدته مفيدًا، فلا تتردد في مشاركته مع من تعتقد أنه قد يفيده أيضًا، ولا تنسَ إضافته إلى شريط المفضلة!

    IT Tools مفتوح المصدر (تحت رخصة GPL-3.0) ومجاني، وسيظل كذلك دائمًا، لكن تكلفة الاستضافة وتجديد اسم النطاق تتحملها أنا. إذا كنت تريد دعم عملي وتشجيعي على إضافة المزيد من الأدوات، يرجى التفكير في دعمي عبر [الرعاية](https://www.buymeacoffee.com/cthmsst).

    ## التقنيات

    IT Tools مبني باستخدام Vue.js (Vue 3) مع مكتبة مكونات Naive UI، ويتم استضافته ونشره بشكل مستمر من خلال Vercel. يتم استخدام مكتبات مفتوحة المصدر من جهات خارجية في بعض الأدوات، ويمكنك العثور على القائمة الكاملة في ملف [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) في المستودع.

    ## وجدت خطأ؟ أداة مفقودة؟

    إذا كنت بحاجة إلى أداة غير موجودة حاليًا هنا، وتعتقد أنها مفيدة، فأنت مرحب بك لتقديم طلب ميزة في [قسم المشكلات](https://github.com/CorentinTh/it-tools/issues/new/choose) في مستودع GitHub.

    وإذا وجدت خطأً، أو أن شيئًا لا يعمل كما هو متوقع، يرجى تقديم تقرير خطأ في [قسم المشكلات](https://github.com/CorentinTh/it-tools/issues/new/choose) في مستودع GitHub.
