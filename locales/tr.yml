aboutPage:
  content: >
    # IT-Tools Hakkında

    Bu harika web sitesi, [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) tarafından ❤ ile yapılmıştır ve geliştiriciler ile BT alanında çalışanlar için kullanışlı araçları bir araya getirir. Faydalı bulduysanız, lütfen faydalı bulabileceğini düşündüğünüz kişilerle paylaşın ve sık kullanılanlar çubuğunuza eklemeyi unutmayın!

    IT Tools açık kaynaklıdır (GPL-3.0 lisansı altında) ve ücretsizdir, her zaman da öyle kalacaktır, ancak barındırma ve alan adı yenileme maliyetleri vardır. Çalışmalarımı desteklemek ve daha fazla araç eklemem için beni teşvik etmek isterseniz, lütfen [beni sponsor olarak desteklemeyi](https://www.buymeacoffee.com/cthmsst) düşünün.

    ## Teknolojiler

    IT Tools, Vue.js (Vue 3) ve Naive UI bileşen kütüphanesi ile yapılmıştır ve Vercel tarafından barındırılıp sürekli olarak dağıtılmaktadır. Bazı araçlarda üçüncü taraf açık kaynaklı kütüphaneler kullanılmaktadır, tam listeyi deponun [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) dosyasında bulabilirsiniz.

    ## Bir hata mı buldunuz? Bir araç mı eksik?

    Burada bulunmayan ve faydalı olabileceğini düşündüğünüz bir araca ihtiyacınız varsa, GitHub deposundaki [sorunlar bölümünde](https://github.com/CorentinTh/it-tools/issues/new/choose) bir özellik talebi göndermenizi bekleriz.

    Ve bir hata bulduysanız veya bir şey beklendiği gibi çalışmıyorsa, lütfen GitHub deposundaki [sorunlar bölümünde](https://github.com/CorentinTh/it-tools/issues/new/choose) bir hata raporu doldurun.

