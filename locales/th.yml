  mac-address-generator:
    title: ตัวสร้าง MAC address
    description: ป้อนจำนวนและคำนำหน้า MAC address จะถูกสร้างในรูปแบบตัวพิมพ์ที่คุณเลือก (ตัวพิมพ์ใหญ่หรือตัวพิมพ์เล็ก)

  json-diff:
    title: เปรียบเทียบ JSON
    description: เปรียบเทียบออบเจกต์ JSON สองตัวและดูความแตกต่างระหว่างกัน

  jwt-parser:
    title: ตัวแยกวิเคราะห์ JWT
    description: แยกวิเคราะห์และถอดรหัส JSON Web Token (JWT) ของคุณและแสดงเนื้อหา

  date-converter:
    title: ตัวแปลงวันที่และเวลา
    description: แปลงวันที่และเวลาระหว่างรูปแบบต่างๆ

  phone-parser-and-formatter:
    title: ตัวแยกวิเคราะห์และจัดรูปแบบเบอร์โทร
    description: แยกวิเคราะห์ ตรวจสอบและจัดรูปแบบหมายเลขโทรศัพท์ รับข้อมูลเกี่ยวกับหมายเลขโทรศัพท์ เช่น รหัสประเทศ ประเภท ฯลฯ

  ipv4-subnet-calculator:
    title: เครื่องคิดเลข Subnet IPv4
    description: แยกวิเคราะห์บล็อก CIDR IPv4 ของคุณและรับข้อมูลทั้งหมดที่คุณต้องการเกี่ยวกับ subnet ของคุณ

  og-meta-generator:
    title: ตัวสร้าง Open Graph meta
    description: สร้างแท็ก meta Open Graph และโซเชียลมีเดีย HTML สำหรับเว็บไซต์ของคุณ

  ipv6-ula-generator:
    title: ตัวสร้าง IPv6 ULA
    description: สร้างที่อยู่ IP ภายในเครือข่ายที่ไม่สามารถกำหนดเส้นทางได้สำหรับเครือข่ายของคุณตาม RFC4193

  hash-text:
    title: แฮชข้อความ
    description: 'แฮชสตริงข้อความโดยใช้ฟังก์ชันที่คุณต้องการ: MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 หรือ RIPEMD160'

  json-to-toml:
    title: JSON เป็น TOML
    description: แยกวิเคราะห์และแปลง JSON เป็น TOML

  device-information:
    title: ข้อมูลอุปกรณ์
    description: รับข้อมูลเกี่ยวกับอุปกรณ์ปัจจุบันของคุณ (ขนาดหน้าจอ, อัตราส่วนพิกเซล, user agent, ...)

  pdf-signature-checker:
    title: ตัวตรวจสอบลายเซ็น PDF
    description: ตรวจสอบลายเซ็นของไฟล์ PDF ไฟล์ PDF ที่ลงนามจะมีลายเซ็นหนึ่งหรือหลายรายการที่ใช้ตรวจสอบว่าเนื้อหาของไฟล์ถูกแก้ไขหรือไม่หลังจากลงนาม

  json-minify:
    title: ย่อ JSON
    description: ย่อและบีบอัด JSON ของคุณโดยลบช่องว่างที่ไม่จำเป็น

  ulid-generator:
    title: ตัวสร้าง ULID
    description: สร้าง Universally Unique Lexicographically Sortable Identifier (ULID) แบบสุ่ม

  string-obfuscator:
    title: ตัวบดบังสตริง
    description: บดบังสตริง (เช่น ความลับ, IBAN หรือโทเค็น) เพื่อให้สามารถแชร์และระบุได้โดยไม่เปิดเผยเนื้อหา

  base-converter:
    title: ตัวแปลงฐานจำนวนเต็ม
    description: แปลงหมายเลขระหว่างฐานต่างๆ (ฐานสิบ, เฮกซาเดซิมัล, ไบนารี, ออค탈, base64, ...)

  yaml-to-json-converter:
    title: ตัวแปลง YAML เป็น JSON
    description: แปลง YAML เป็น JSON ได้อย่างง่ายดายด้วยตัวแปลงออนไลน์แบบเรียลไทม์นี้

  uuid-generator:
    title: ตัวสร้าง UUID
    description: Universally Unique Identifier (UUID) เป็นตัวเลข 128 บิตที่ใช้ระบุข้อมูลในระบบคอมพิวเตอร์ จำนวน UUID ที่เป็นไปได้คือ 16^32 ซึ่งเท่ากับ 2^128 หรือประมาณ 3.4x10^38 (ซึ่งมากจริงๆ!)

  ipv4-address-converter:
    title: ตัวแปลงที่อยู่ IPv4
    description: แปลงที่อยู่ IP เป็นเลขฐานสิบ, ไบนารี, เฮกซาเดซิมัล หรือแม้แต่รูปแบบ IPv6

  text-statistics:
    title: สถิติข้อความ
    description: รับข้อมูลเกี่ยวกับข้อความ จำนวนอักขระ จำนวนคำ ขนาดเป็นไบต์, ...

  text-to-nato-alphabet:
    title: ข้อความเป็นตัวอักษร NATO
    description: แปลงข้อความเป็นตัวอักษรตามหลักการออกเสียง NATO สำหรับการส่งข้อมูลทางวาจา

  basic-auth-generator:
    title: ตัวสร้าง Basic auth
    description: สร้างส่วนหัว base64 basic auth จากชื่อผู้ใช้และรหัสผ่าน

  text-to-unicode:
    title: ข้อความเป็น Unicode
    description: แยกวิเคราะห์และแปลงข้อความเป็น Unicode และในทางกลับกัน

  ipv4-range-expander:
    title: ตัวขยายช่วง IPv4
    description: เมื่อระบุที่อยู่ IPv4 ต้นทางและปลายทาง เครื่องมือนี้จะคำนวณ subnet IPv4 ที่ถูกต้องพร้อมสัญลักษณ์ CIDR

  text-diff:
    title: เปรียบเทียบข้อความ
    description: เปรียบเทียบข้อความสองชิ้นและดูความแตกต่างระหว่างกัน

  otp-generator:
    title: ตัวสร้างรหัส OTP
    description: สร้างและตรวจสอบ OTP (รหัสผ่านครั้งเดียว) แบบใช้เวลาสำหรับการยืนยันตัวตนหลายปัจจัย

  url-encoder:
    title: เข้ารหัส/ถอดรหัสสตริงรูปแบบ URL
    description: เข้ารหัสข้อความเป็นรูปแบบ URL-encoded (หรือที่รู้จักในชื่อ "percent-encoded") หรือถอดรหัสจากมัน

  text-to-binary:
    title: ข้อความเป็นไบนารี ASCII
    description: แปลงข้อความเป็นรูปแบบไบนารี ASCII และในทางกลับกัน

  unix-timestamp-converter:
    title: ตัวแปลง Unix timestamp
    description: แปลง Unix timestamp เป็นวันที่ที่อ่านง่ายและในทางกลับกัน รองรับวินาทีและมิลลิวินาที

  speed-test:
    title: ทดสอบความเร็วอินเทอร์เน็ต
    description: ทดสอบความเร็วการเชื่อมต่ออินเทอร์เน็ตของคุณออนไลน์ วัดความเร็วดาวน์โหลด ความเร็วอัปโหลด และความหน่วง ping

  dns-lookup:
    title: ค้นหา DNS
    description: ค้นหาบันทึก DNS สำหรับโดเมนใดก็ได้ ตรวจสอบบันทึก A, AAAA, MX, TXT, CNAME และ NS ออนไลน์

  ssl-checker:
    title: ตัวตรวจสอบใบรับรอง SSL
    description: ตรวจสอบรายละเอียดใบรับรอง SSL สำหรับเว็บไซต์ใดก็ได้ ตรวจสอบความถูกต้องของใบรับรอง วันหมดอายุ และข้อมูลผู้ออกใบรับรอง

  website-checker:
    title: ตัวตรวจสอบเว็บไซต์ล่ม
    description: ตรวจสอบว่าเว็บไซต์ล่มหรือทำงานอยู่ ทดสอบความพร้อมใช้งานของเว็บไซต์จากหลายตำแหน่งทั่วโลก

  my-ip:
    title: ที่อยู่ IP ของฉันคืออะไร
    description: ตรวจสอบที่อยู่ IP สาธารณะของคุณออนไลน์ เครื่องมือค้นหาที่อยู่ IP ฟรีแสดง IP ตำแหน่ง และข้อมูล ISP ของคุณ

