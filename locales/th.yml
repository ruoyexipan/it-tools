aboutPage:
  content: >
    # เกี่ยวกับ IT-Tools

    เว็บไซต์ที่ยอดเยี่ยมนี้สร้างขึ้นด้วย ❤ โดย [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) รวบรวมเครื่องมือที่เป็นประโยชน์สำหรับนักพัฒนาและผู้ที่ทำงานด้าน IT หากคุณพบว่ามีประโยชน์ โปรดแบ่งปันให้คนที่คุณคิดว่าจะมีประโยชน์เช่นกัน และอย่าลืมบุ๊กมาร์กไว้ในแถบทางลัดของคุณ!

    IT Tools เป็นโอเพ่นซอร์ส (ภายใต้สัญญาอนุญาต GPL-3.0) และฟรี แต่ต้องเสียค่าใช้จ่ายในการโฮสต์และต่ออายุชื่อโดเมน หากคุณต้องการสนับสนุนงานของเราและสนับสนุนให้เราเพิ่มเครื่องมือมากขึ้น โปรดพิจารณาสนับสนุนโดย [การเป็นสปอนเซอร์](https://www.buymeacoffee.com/cthmsst)

    ## เทคโนโลยี

    IT Tools สร้างด้วย Vue.js (Vue 3) พร้อมไลบรารีคอมโพเนนต์ Naive UI และโฮสต์และปรับใช้อย่างต่อเนื่องโดย Vercel ไลบรารีโอเพ่นซอร์สจากบุคคลที่สามถูกใช้ในเครื่องมือบางส่วน คุณสามารถดูรายการทั้งหมดได้ในไฟล์ [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) ของ repository

    ## พบบั๊ก? เครื่องมือหายไป?

    หากคุณต้องการเครื่องมือที่ยังไม่มีในปัจจุบัน และคุณคิดว่ามันมีประโยชน์ ยินดีต้อนรับส่งคำขอฟีเจอร์ใน [ส่วน issues](https://github.com/CorentinTh/it-tools/issues/new/choose) ใน GitHub repository

    และหากคุณพบบั๊กหรือบางอย่างไม่ทำงานตามที่คาดหวัง โปรดรายงานบั๊กใน [ส่วน issues](https://github.com/CorentinTh/it-tools/issues/new/choose) ใน GitHub repository

