    description: Huraikan dan nyahkod Token Web JSON (jwt) anda dan paparkan kandungannya.

  date-converter:
    title: Penukar tarikh-masa
    description: Tukar tarikh dan masa kepada pelbagai format yang berbeza

  phone-parser-and-formatter:
    title: Penghurai dan pemformat telefon
    description: Huraikan, sahkan dan format nombor telefon. Dapatkan maklumat tentang nombor telefon, seperti kod negara, jenis, dll.

  ipv4-subnet-calculator:
    title: Kalkulator subnet IPv4
    description: Huraikan blok CIDR IPv4 anda dan dapatkan semua maklumat yang anda perlukan tentang subnet anda.

  og-meta-generator:
    title: Penjana meta Open Graph
    description: Jana tag meta Open Graph dan sosial HTML untuk laman web anda.

  ipv6-ula-generator:
    title: Penjana ULA IPv6
    description: Jana alamat IP tempatan anda sendiri, tidak boleh dihala untuk rangkaian anda mengikut RFC4193.

  hash-text:
    title: Hash teks
    description: 'Hash rentetan teks menggunakan fungsi yang anda perlukan: MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 atau RIPEMD160'

  json-to-toml:
