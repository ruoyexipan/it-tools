    description: Kecilkan dan mampatkan JSON anda dengan membuang ruang kosong yang tidak perlu.

  ulid-generator:
    title: Penjana ULID
    description: Jana Pengenal Pasti Boleh Isih Leksikografi Sejagat (ULID) rawak.

  string-obfuscator:
    title: Kaburkan rentetan
    description: Kaburkan rentetan (seperti rahsia, IBAN, atau token) untuk menjadikannya boleh dikongsi dan dikenal pasti tanpa mendedahkan kandungannya.

  base-converter:
    title: Penukar asas integer
    description: Tukar nombor antara asas yang berbeza (persepulahan, perenambelasan, perduaan, perlapanan, base64, ...)

  yaml-to-json-converter:
    title: Penukar YAML ke JSON
    description: Mudah tukar YAML ke JSON dengan penukar langsung dalam talian ini.

  uuid-generator:
    title: Penjana UUID
    description: Pengenal Pasti Unik Sejagat (UUID) ialah nombor 128-bit yang digunakan untuk mengenal pasti maklumat dalam sistem komputer. Bilangan UUID yang mungkin ialah 16^32, iaitu 2^128 atau kira-kira 3.4x10^38 (yang mana banyak!).

  ipv4-address-converter:
    title: Penukar alamat IPv4
    description: Tukar alamat IP kepada perpuluhan, perduaan, perenambelasan, atau walaupun representasi IPv6nya.

  text-statistics:
    title: Statistik teks
    description: Dapatkan maklumat tentang teks, bilangan aksara, bilangan perkataan, saiznya dalam bait, ...

  text-to-nato-alphabet:
    title: Teks ke abjad NATO
    description: Ubah teks kepada abjad fonetik NATO untuk penghantaran lisan.

  basic-auth-generator:
    title: Penjana auth asas
    description: Jana tajuk auth asas base64 daripada nama pengguna dan kata laluan.

  text-to-unicode:
    title: Teks ke Unicode
    description: Huraikan dan tukar teks ke unicode dan sebaliknya

  ipv4-range-expander:
    title: Pengembang julat IPv4
    description: Diberikan alamat IPv4 permulaan dan akhir, alat ini mengira subnet IPv4 yang sah bersama dengan tatatanda CIDRnya.

  text-diff:
    title: Perbezaan teks
    description: Bandingkan dua teks dan lihat perbezaan antara mereka.

  otp-generator:
    title: Penjana kod OTP
    description: Jana dan sahkan OTP (kata laluan sekali guna) berasaskan masa untuk pengesahan berbilang faktor.

  url-encoder:
    title: Enkod/nyahkod rentetan berformat URL
    description: Enkod teks kepada format URL-dikodkan (juga dikenali sebagai "peratus-dikod"), atau nyahkod daripadanya.

  text-to-binary:
    title: Teks ke binari ASCII
    description: Tukar teks kepada representasi binari ASCIInya dan sebaliknya.

  unix-timestamp-converter:
    title: Penukar cap masa Unix
    description: Tukar cap masa Unix kepada tarikh yang boleh dibaca oleh manusia dan sebaliknya. Menyokong saat dan milisaat.

  speed-test:
    title: Ujian kelajuan internet
    description: Uji kelajuan sambungan internet anda dalam talian. Ukur kelajuan muat turun, kelajuan muat naik, dan kependaman ping.

  dns-lookup:
    title: Carian DNS
    description: Cari rekod DNS untuk mana-mana domain. Semak rekod A, AAAA, MX, TXT, CNAME, dan NS dalam talian.

  ssl-checker:
    title: Pemeriksa sijil SSL
    description: Semak butiran sijil SSL untuk mana-mana laman web. Sahkan kesahihan sijil, tarikh tamat tempoh, dan maklumat pengeluar.

  website-checker:
    title: Pemeriksa laman web turun
    description: Semak jika laman web turun atau naik. Uji ketersediaan laman web dari pelbagai lokasi di seluruh dunia.

  my-ip:
    title: Apakah alamat IP saya
    description: Semak alamat IP awam anda dalam talian. Alat carian IP percuma yang memaparkan IP, lokasi, dan maklumat ISP anda.

