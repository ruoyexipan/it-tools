    description: Cari kod kekunci javascript, kod, lokasi dan pengubah suai mana-mana kekunci yang ditekan.

  emoji-picker:
    title: Pemilih emoji
    description: Salin dan tampal emoji dengan mudah dan dapatkan nilai unicode dan titik kod setiap emoji.

  color-converter:
    title: Penukar warna
    description: Tukar warna antara format yang berbeza (hex, rgb, hsl dan nama css)

  bcrypt:
    title: Bcrypt
    description: Hash dan bandingkan rentetan teks menggunakan bcrypt. Bcrypt adalah fungsi hashing kata laluan berdasarkan sifer Blowfish.

  crontab-generator:
    title: Penjana crontab
    description: Sahkan dan jana crontab dan dapatkan penerangan yang boleh dibaca oleh manusia tentang jadual cron.

  http-status-codes:
    title: Kod status HTTP
    description: Senarai semua kod status HTTP, nama mereka, dan makna mereka.

  sql-prettify:
    title: Cantik dan format SQL
    description: Format dan cantikkan pertanyaan SQL anda dalam talian (ia menyokong pelbagai dialek SQL).

  benchmark-builder:
    title: Pembina penanda aras
    description: Mudah membandingkan masa pelaksanaan tugas dengan pembina penanda aras dalam talian yang sangat mudah ini.

  git-memo:
    title: Lembaran tipu git
    description: Git adalah perisian pengurusan versi yang terdesentralisasi. Dengan lembaran tipu ini, anda akan mempunyai akses pantas kepada arahan git yang paling biasa.

  slugify-string:
    title: Slugify rentetan
    description: Jadikan rentetan url, nama fail dan id selamat.

  encryption:
    title: Sulit / buka sulit teks
    description: Sulitkan teks jelas dan buka sulit teks sifer menggunakan algoritma kripto seperti AES, TripleDES, Rabbit atau RC4.

  random-port-generator:
    title: Penjana port rawak
    description: Jana nombor port rawak di luar julat port "dikenali" (0-1023).

  yaml-prettify:
    title: Cantik dan format YAML
    description: Cantikkan rentetan YAML anda ke dalam format yang mesra dan boleh dibaca oleh manusia.

  eta-calculator:
    title: Kalkulator ETA
    description: Kalkulator ETA (Anggaran Masa Ketibaan) untuk menentukan anggaran masa akhir tugas, contohnya, masa akhir dan tempoh muat turun fail.

  roman-numeral-converter:
    title: Penukar angka Rom
    description: Tukar angka Rom kepada nombor dan tukar nombor kepada angka Rom.

  hmac-generator:
    title: Penjana HMAC
    description: Mengira kod pengesahan mesej berasaskan hash (HMAC) menggunakan kunci rahsia dan fungsi hashing kegemaran anda.

  bip39-generator:
    title: Penjana frasa laluan BIP39
    description: Jana frasa laluan BIP39 daripada mnemonik sedia ada atau rawak, atau dapatkan mnemonik daripada frasa laluan.

  base64-file-converter:
    title: Penukar fail Base64
    description: Tukar rentetan, fail, atau imej kepada representasi base64nya.

  list-converter:
    title: Penukar senarai
    description: Alat ini boleh memproses data berasaskan lajur dan menggunakan pelbagai perubahan (transpos, tambah awalan dan akhiran, terbalikkan senarai, isih senarai, nilai huruf kecil, nilai potong) pada setiap baris.

  base64-string-converter:
    title: Pengekod/penyahkod rentetan Base64
    description: Mudah mengenkod dan menyahkod rentetan kepada representasi base64nya.

  toml-to-yaml:
    title: TOML ke YAML
    description: Huraikan dan tukar TOML ke YAML.

  math-evaluator:
    title: Penilai matematik
    description: Kalkulator untuk menilai ungkapan matematik. Anda boleh menggunakan fungsi seperti sqrt, cos, sin, abs, dll.

  json-to-yaml-converter:
    title: Penukar JSON ke YAML
    description: Mudah tukar JSON ke YAML dengan penukar langsung dalam talian ini.

  url-parser:
    title: Penghurai URL
    description: Huraikan URL kepada bahagian-bahagian penyusun yang berasingan (protokol, asal, parameter, port, nama pengguna-kata laluan, ...)

  iban-validator-and-parser:
    title: Pengesah dan penghurai IBAN
    description: Sahkan dan huraikan nombor IBAN. Semak jika IBAN adalah sah dan dapatkan negara, BBAN, jika ia adalah QR-IBAN dan format mesra IBAN.

  user-agent-parser:
    title: Penghurai ejen pengguna
    description: Kesan dan huraikan Pelayar, Enjin, OS, CPU, dan jenis/model peranti daripada rentetan ejen pengguna.

  numeronym-generator:
    title: Penjana numeronim
    description: Numeronim adalah perkataan yang menggunakan nombor untuk membentuk singkatan. Sebagai contoh, "i18n" adalah numeronim daripada "internationalization" di mana 18 mewakili bilangan huruf antara i pertama dan n terakhir dalam perkataan itu.

  case-converter:
    title: Penukar kes
    description: Ubah kes rentetan dan pilih antara format yang berbeza

  html-entities:
    title: Entiti HTML lari
    description: Lari atau batalkan lari entiti HTML (gantikan aksara seperti <,>, &, " dan \' dengan versi HTML mereka)

  json-prettify:
    title: Cantik dan format JSON
    description: Cantikkan rentetan JSON anda ke dalam format yang mesra dan boleh dibaca oleh manusia.

  docker-run-to-docker-compose-converter:
    title: Penukar docker run ke docker compose
    description: Mengubah arahan "docker run" kepada fail docker-compose!

  mac-address-lookup:
    title: Carian alamat MAC
    description: Cari vendor dan pengeluar peranti melalui alamat MACnya.

  mime-types:
    title: Jenis MIME
    description: Tukar jenis MIME kepada sambungan fail dan sebaliknya.

  toml-to-json:
    title: TOML ke JSON
    description: Huraikan dan tukar TOML ke JSON.

  lorem-ipsum-generator:
    title: Penjana lorem ipsum
    description: Lorem ipsum adalah teks pemegang tempat yang biasa digunakan untuk menunjukkan bentuk visual dokumen atau jenis fon tanpa bergantung pada kandungan yang bermakna

  qrcode-generator:
    title: Penjana kod QR
    description: Jana dan muat turun kod QR untuk URL (atau hanya teks biasa), dan sesuaikan warna latar belakang dan latar depan.

  wifi-qrcode-generator:
    title: Penjana kod QR WiFi
    description: Jana dan muat turun kod QR untuk sambungan pantas ke rangkaian WiFi.

  xml-formatter:
    title: Pemformat XML
    description: Cantikkan rentetan XML anda ke dalam format yang mesra dan boleh dibaca oleh manusia.

  temperature-converter:
    title: Penukar suhu
    description: Penukaran suhu darjah untuk Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur, dan Rømer.

  chmod-calculator:
