    description: Kira kebenaran dan arahan chmod anda dengan kalkulator chmod dalam talian ini.

  rsa-key-pair-generator:
    title: Penjana pasangan kunci RSA
    description: Jana pasangan kunci sijil pem swasta dan awam RSA rawak baru.

  html-wysiwyg-editor:
    title: Penyunting HTML WYSIWYG
    description: Penyunting HTML WYSIWYG dalam talian yang kaya ciri yang menjana kod sumber kandungan dengan segera.

  yaml-to-toml:
    title: YAML ke TOML
    description: Huraikan dan tukar YAML ke TOML.

  mac-address-generator:
    title: Penjana alamat MAC
    description: Masukkan kuantiti dan awalan. Alamat MAC akan dijana dalam kes yang anda pilih (huruf besar atau huruf kecil)

  json-diff:
    title: Perbezaan JSON
    description: Bandingkan dua objek JSON dan dapatkan perbezaan antara mereka.

  jwt-parser:
