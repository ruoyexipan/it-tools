aboutPage:
  content: >
    # Tentang IT-Tools

    Laman web yang indah ini, dibuat dengan ❤ oleh [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), mengumpulkan alat-alat berguna untuk pembangun dan orang yang bekerja dalam IT. Jika anda mendapati ia berguna, sila kongsi dengan orang yang anda rasa mungkin mendapati ia berguna juga dan jangan lupa untuk menandainya dalam bar pintasan anda!

    IT Tools adalah sumber terbuka (di bawah lesen GPL-3.0) dan percuma, dan akan sentiasa begitu, tetapi ia memerlukan kos untuk saya hos dan memperbaharui nama domain. Jika anda ingin menyokong kerja saya, dan menggalakkan saya menambah lebih banyak alat, sila pertimbangkan untuk menyokong dengan [menaja saya](https://www.buymeacoffee.com/cthmsst).

    ## Teknologi

    IT Tools dibuat dalam Vue.js (Vue 3) dengan pustaka komponen Naive UI dan dihos serta dikerahkan secara berterusan oleh Vercel. Pustaka sumber terbuka pihak ketiga digunakan dalam beberapa alat, anda boleh menemui senarai lengkap dalam fail [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) repositori.

    ## Menemui pepijat? Alat tiada?

    Jika anda memerlukan alat yang pada masa ini tidak ada di sini, dan anda rasa ia boleh berguna, anda dialu-alukan untuk menghantar permintaan ciri dalam [bahagian isu](https://github.com/CorentinTh/it-tools/issues/new/choose) dalam repositori GitHub.

    Dan jika anda menemui pepijat, atau sesuatu tidak berfungsi seperti yang dijangkakan, sila failkan laporan pepijat dalam [bahagian isu](https://github.com/CorentinTh/it-tools/issues/new/choose) dalam repositori GitHub.

