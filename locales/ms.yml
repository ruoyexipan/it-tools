  svg-placeholder-generator:
    title: Penjana pemegang tempat SVG
    description: Jana imej svg untuk digunakan sebagai pemegang tempat dalam aplikasi anda.

  json-to-csv:
    title: JSON ke CSV
    description: Tukar JSON ke CSV dengan pengesanan tajuk automatik.

  camera-recorder:
