  password-strength-analyser:
    title: Wachtwoordsterkte analyse
    description: Ontdek de sterkte van je wachtwoord met deze wachtwoordsterkte-analyse tool en schatting van de kraaktijd, volledig in de browser.

  chronometer:
    title: Chronometer
    description: Houd de duur van iets bij. In wezen een chronometer met eenvoudige chronometerfuncties.

  token-generator:
    title: Token generator
    description: Genereer een willekeurige tekenreeks met de tekens die je wilt, hoofdletters of kleine letters, cijfers en/of symbolen.

    uppercase: Hoofdletters (ABC...)
    lowercase: Kleine letters (abc...)
    numbers: Cijfers (123...)
    symbols: Symbolen (!-;...)
    length: Lengte
    tokenPlaceholder: 'De token...'
    copied: Token gekopieerd naar het klembord
    button:
      copy: Kopiëren
      refresh: Vernieuwen
  percentage-calculator:
    title: Percentagecalculator
    description: Bereken eenvoudig percentages van de ene waarde naar de andere, of van een percentage naar een waarde.

  svg-placeholder-generator:
    title: SVG placeholder generator
    description: Genereer SVG-afbeeldingen om als placeholder te gebruiken in je applicaties.

  json-to-csv:
    title: JSON naar CSV
    description: Converteer JSON naar CSV met automatische headerdetectie.

  camera-recorder:
    title: Camera recorder
    description: Maak een foto of neem een video op van je webcam of camera.

  keycode-info:
    title: Keycode info
    description: Vind de JavaScript keycode, code, locatie en modifiers van elke ingedrukte toets.

  emoji-picker:
    title: Emoji kiezer
    description: Kopieer en plak emojis eenvoudig en verkrijg de unicode en code point waarde van elke emoji.

  color-converter:
    title: Kleurconverter
    description: Converteer kleuren tussen de verschillende formaten (hex, rgb, hsl en CSS-naam)

  bcrypt:
    title: Bcrypt
    description: Hash en vergelijk tekststrings met bcrypt. Bcrypt is een wachtwoord-hashfunctie gebaseerd op het Blowfish-cijfer.

  crontab-generator:
    title: Crontab generator
    description: Valideer en genereer crontab en verkrijg de menselijk leesbare beschrijving van het cron-schema.

  http-status-codes:
    title: HTTP statuscodes
    description: De lijst van alle HTTP statuscodes, hun naam en hun betekenis.

  sql-prettify:
    title: SQL opmaken en formatteren
    description: Formatteer en maak je SQL-query\'s online op (ondersteunt verschillende SQL-dialecten).

  benchmark-builder:
    title: Benchmark builder
    description: Vergelijk eenvoudig de uitvoertijd van taken met deze eenvoudige online benchmark builder.

  git-memo:
    title: Git cheatsheet
    description: Git is een gedecentraliseerd versiebeheerprogramma. Met deze cheatsheet heb je snel toegang tot de meest gebruikte git-commando\'s.

  slugify-string:
    title: Slugify string
    description: Maak een tekenreeks URL-, bestandsnaam- en ID-veilig.

  encryption:
    title: Tekst versleutelen / ontsleutelen
    description: Versleutel plattekst en ontsleutel ciphertext met crypto-algoritmen zoals AES, TripleDES, Rabbit of RC4.

  random-port-generator:
    title: Willekeurige poort generator
    description: Genereer willekeurige poortnummers buiten het bereik van "bekende" poorten (0-1023).

  yaml-prettify:
    title: YAML opmaken en formatteren
    description: Maak je YAML-string op naar een vriendelijk, menselijk leesbaar formaat.

  eta-calculator:
    title: ETA calculator
    description: Een ETA (Geschatte Aankomsttijd) calculator om de geschatte eindtijd van een taak te bepalen, bijvoorbeeld de eindtijd en duur van een bestandsdownload.

  roman-numeral-converter:
    title: Romeins cijfer converter
    description: Converteer Romeinse cijfers naar getallen en getallen naar Romeinse cijfers.

  hmac-generator:
    title: Hmac generator
    description: Bereken een hash-gebaseerd berichtauthenticatiecode (HMAC) met een geheime sleutel en je favoriete hashfunctie.

  bip39-generator:
    title: BIP39 wachtwoordzin generator
    description: Genereer een BIP39 wachtwoordzin uit een bestaande of willekeurige mnemonic, of verkrijg de mnemonic uit de wachtwoordzin.

  base64-file-converter:
    title: Base64 bestandsconverter
    description: Converteer een tekenreeks, bestand of afbeelding naar de base64-representatie.

  list-converter:
    title: Lijst converter
    description: Deze tool kan kolomgebaseerde gegevens verwerken en diverse wijzigingen toepassen (transponeren, voorvoegsel en achtervoegsel toevoegen, lijst omkeren, lijst sorteren, waarden naar kleine letters, waarden afkappen) op elke rij.

  base64-string-converter:
    title: Base64 string encoder/decoder
    description: Codeer en decodeer eenvoudig tekenreeksen naar hun base64-representatie.

  toml-to-yaml:
    title: TOML naar YAML
    description: Parseer en converteer TOML naar YAML.

  math-evaluator:
    title: Wiskundige evaluator
    description: Een calculator voor het evalueren van wiskundige expressies. Je kunt functies gebruiken zoals sqrt, cos, sin, abs, enz.

  json-to-yaml-converter:
    title: JSON naar YAML converter
    description: Converteer eenvoudig JSON naar YAML met deze online live converter.

  url-parser:
    title: URL parser
    description: Parseer een URL in zijn afzonderlijke onderdelen (protocol, oorsprong, params, poort, gebruikersnaam-wachtwoord, ...)

  iban-validator-and-parser:
    title: IBAN validator en parser
    description: Valideer en parseer IBAN-nummers. Controleer of een IBAN geldig is en verkrijg het land, BBAN, of het een QR-IBAN is en het IBAN-vriendelijke formaat.

  user-agent-parser:
    title: User-agent parser
    description: Detecteer en parseer Browser, Engine, Besturingssysteem, CPU en Apparaattype/model uit een user-agent string.

  numeronym-generator:
    title: Numeroniem generator
    description: Een numeroniem is een woord waarin een cijfer wordt gebruikt om een afkorting te vormen. Bijvoorbeeld, "i18n" is een numeroniem van "internationalization" waar 18 staat voor het aantal letters tussen de eerste i en de laatste n in het woord.

  case-converter:
    title: Case converter
    description: Transformeer de case van een tekenreeks en kies tussen verschillende formaten

  html-entities:
    title: HTML-entiteiten escapen
    description: Escape of unescape HTML-entiteiten (vervang tekens zoals <,>, &, " en \' door hun HTML-versie)

  json-prettify:
    title: JSON opmaken en formatteren
    description: Maak je JSON-string op naar een vriendelijk, menselijk leesbaar formaat.

  docker-run-to-docker-compose-converter:
    title: Docker run naar Docker compose converter
    description: Transformeert "docker run" commando\'s naar docker-compose bestanden!

  mac-address-lookup:
    title: MAC-adres opzoeken
    description: Vind de leverancier en fabrikant van een apparaat aan de hand van het MAC-adres.

  mime-types:
    title: MIME-types
    description: Converteer MIME-types naar bestandsextensies en vice versa.

  toml-to-json:
    title: TOML naar JSON
    description: Parseer en converteer TOML naar JSON.

  lorem-ipsum-generator:
    title: Lorem ipsum generator
    description: Lorem ipsum is een placeholder-tekst die vaak wordt gebruikt om de visuele vorm van een document of een lettertype weer te geven zonder afhankelijk te zijn van betekenisvolle inhoud

  qrcode-generator:
    title: QR Code generator
    description: Genereer en download een QR-code voor een URL (of gewoon platte tekst) en pas de voor- en achtergrondkleuren aan.

  wifi-qrcode-generator:
    title: WiFi QR Code generator
    description: Genereer en download QR-codes voor snelle verbindingen met WiFi-netwerken.

  xml-formatter:
    title: XML formatter
    description: Maak je XML-string op naar een vriendelijk, menselijk leesbaar formaat.

  temperature-converter:
    title: Temperatuurconverter
    description: Temperatuurconversies in graden voor Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur en Rømer.

  chmod-calculator:
    title: Chmod calculator
    description: Bereken je chmod-machtigingen en commando\'s met deze online chmod calculator.

  rsa-key-pair-generator:
    title: RSA sleutelpaar generator
    description: Genereer een nieuw willekeurig RSA privé- en openbaar PEM-certificaat sleutelpaar.

  html-wysiwyg-editor:
    title: HTML WYSIWYG editor
    description: Online, uitgebreide WYSIWYG HTML-editor die direct de broncode van de inhoud genereert.

  yaml-to-toml:
    title: YAML naar TOML
    description: Parseer en converteer YAML naar TOML.

  mac-address-generator:
    title: MAC-adres generator
    description: Voer de hoeveelheid en het prefix in. MAC-adressen worden gegenereerd in de door jou gekozen case (hoofdletters of kleine letters)

  json-diff:
    title: JSON diff
    description: Vergelijk twee JSON-objecten en verkrijg de verschillen ertussen.

  jwt-parser:
    title: JWT parser
    description: Parseer en decodeer je JSON Web Token (JWT) en geef de inhoud weer.

  date-converter:
    title: Datum-tijd converter
    description: Converteer datum en tijd naar de verschillende formaten

  phone-parser-and-formatter:
    title: Telefoonnummer parser en formatter
    description: Parseer, valideer en formatteer telefoonnummers. Verkrijg informatie over het telefoonnummer, zoals de landcode, het type, enz.

  ipv4-subnet-calculator:
    title: IPv4 subnet calculator
    description: Parseer je IPv4 CIDR-blokken en verkrijg alle informatie die je nodig hebt over je subnet.

  og-meta-generator:
    title: Open graph meta generator
    description: Genereer open-graph en social media HTML-metatags voor je website.

  ipv6-ula-generator:
    title: IPv6 ULA generator
    description: Genereer je eigen lokale, niet-routeerbare IP-adressen voor je netwerk volgens RFC4193.

  hash-text:
    title: Tekst hashen
    description: 'Hash een tekststring met de functie die je nodig hebt: MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 of RIPEMD160'

  json-to-toml:
    title: JSON naar TOML
    description: Parseer en converteer JSON naar TOML.

  device-information:
    title: Apparaatinformatie
    description: Verkrijg informatie over je huidige apparaat (schermgrootte, pixelverhouding, user agent, ...)

  pdf-signature-checker:
    title: PDF handtekening checker
    description: Verifieer de handtekeningen van een PDF-bestand. Een ondertekend PDF-bestand bevat een of meer handtekeningen die kunnen worden gebruikt om te bepalen of de inhoud van het bestand is gewijzigd sinds het bestand werd ondertekend.

  json-minify:
    title: JSON minify
    description: Minimaliseer en comprimeer je JSON door onnodige witruimte te verwijderen.

  ulid-generator:
    title: ULID generator
    description: Genereer willekeurige Universally Unique Lexicographically Sortable Identifier (ULID).

  string-obfuscator:
    title: String obfuscator
    description: Verhul een tekenreeks (zoals een geheim, een IBAN of een token) om deze deelbaar en identificeerbaar te maken zonder de inhoud te onthullen.

  base-converter:
    title: Gehele getal basen converter
    description: Converteer een getal tussen verschillende grondtallen (decimaal, hexadecimaal, binair, octaal, base64, ...)

  yaml-to-json-converter:
    title: YAML naar JSON converter
    description: Converteer eenvoudig YAML naar JSON met deze online live converter.

  uuid-generator:
    title: UUID\'s generator
    description: Een Universally Unique Identifier (UUID) is een 128-bit getal dat wordt gebruikt om informatie in computersystemen te identificeren. Het aantal mogelijke UUID\'s is 16^32, oftewel 2^128 of ongeveer 3,4x10^38 (dat is heel veel!).

  ipv4-address-converter:
    title: IPv4 adres converter
    description: Converteer een IP-adres naar decimaal, binair, hexadecimaal, of zelfs een IPv6-representatie ervan.

  text-statistics:
    title: Tekststatistieken
    description: Verkrijg informatie over een tekst, het aantal tekens, het aantal woorden, de grootte in bytes, ...

  text-to-nato-alphabet:
    title: Tekst naar NAVO-alfabet
    description: Transformeer tekst naar het NAVO-fonetische alfabet voor mondelinge overdracht.

  basic-auth-generator:
    title: Basic auth generator
    description: Genereer een base64 basic auth header van een gebruikersnaam en wachtwoord.

  text-to-unicode:
    title: Tekst naar Unicode
    description: Parseer en converteer tekst naar unicode en vice versa

  ipv4-range-expander:
    title: IPv4 bereik expander
    description: Gegeven een begin- en eind-IPv4-adres, berekent deze tool een geldig IPv4-subnet samen met de CIDR-notatie.

  text-diff:
    title: Tekst diff
    description: Vergelijk twee teksten en bekijk de verschillen ertussen.

  otp-generator:
    title: OTP code generator
    description: Genereer en valideer tijdgebaseerde OTP (eenmalig wachtwoord) voor multi-factor authenticatie.

  url-encoder:
    title: URL-gecodeerde strings coderen/decoderen
    description: Codeer tekst naar URL-gecodeerd formaat (ook wel "percent-encoded" genoemd), of decodeer ervan.

  text-to-binary:
    title: Tekst naar ASCII binair
    description: Converteer tekst naar de binaire ASCII-representatie en vice versa.

  unix-timestamp-converter:
    title: Unix tijdstempel converter
    description: Converteer Unix tijdstempels naar menselijk leesbare datums en vice versa. Ondersteunt seconden en milliseconden.

  speed-test:
    title: Internetsnelheidstest
    description: Test je internetsnelheid online. Meet downloadsnelheid, uploadsnelheid en ping-latentie.

  dns-lookup:
    title: DNS lookup
    description: Zoek DNS-records op voor elk domein. Controleer A, AAAA, MX, TXT, CNAME en NS records online.

  ssl-checker:
    title: SSL certificaat checker
    description: Controleer SSL-certificaatgegevens voor elke website. Verifieer de geldigheid, vervaldatum en uitgeverinformatie van het certificaat.

  website-checker:
    title: Website down checker
    description: Controleer of een website down of up is. Test de beschikbaarheid van websites vanuit meerdere locaties wereldwijd.

  my-ip:
    title: Wat is mijn IP-adres
    description: Controleer je openbare IP-adres online. Gratis IP-adres opzoektool die je IP, locatie en ISP-informatie toont.

