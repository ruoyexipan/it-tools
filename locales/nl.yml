aboutPage:
  content: >
    # Over IT-Tools

    Deze geweldige website, gemaakt met ❤ door [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), verzamelt nuttige tools voor ontwikkelaars en mensen die in de IT werken. Als je het nuttig vindt, deel het dan gerust met mensen waarvan je denkt dat ze het ook nuttig vinden en vergeet het niet toe te voegen aan je bladwijzerbalk!

    IT Tools is open-source (onder de GPL-3.0 licentie) en gratis, en zal dat altijd blijven, maar het kost mij geld om te hosten en de domeinnaam te verlengen. Als je mijn werk wilt steunen en mij wilt aanmoedigen om meer tools toe te voegen, overweeg dan om mij te [sponsoren](https://www.buymeacoffee.com/cthmsst).

    ## Technologieën

    IT Tools is gemaakt in Vue.js (Vue 3) met de Naive UI componentenbibliotheek en wordt gehost en continu gedeployed door Vercel. Externe open-source bibliotheken worden in sommige tools gebruikt, je kunt de volledige lijst vinden in het [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) bestand van de repository.

    ## Een bug gevonden? Een tool mist?

    Als je een tool nodig hebt die momenteel niet aanwezig is en je denkt dat deze nuttig kan zijn, ben je welkom om een functieverzoek in te dienen in de [issues sectie](https://github.com/CorentinTh/it-tools/issues/new/choose) van de GitHub repository.

    En als je een bug hebt gevonden of iets niet werkt zoals verwacht, dien dan een bugrapport in bij de [issues sectie](https://github.com/CorentinTh/it-tools/issues/new/choose) van de GitHub repository.

