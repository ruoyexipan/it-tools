  password-strength-analyser:
    title: Analyseur de force de mot de passe
    description: Découvrez la force de votre mot de passe avec cet analyseur de mot de passe côté client et outil d'estimation du temps de craquage.

  chronometer:
    title: Chronomètre
    description: Surveillez la durée d'une chose. En bref, un chronomètre avec des fonctionnalités simples.

  token-generator:
    title: Générateur de token
    description: >-
      Génère une chaîne aléatoire avec les caractères que vous voulez, lettres
      majuscules ou minuscules, chiffres et/ou symboles.
    uppercase: Majuscules (ABC...)
    lowercase: Minuscules (abc...)
    numbers: Chiffres (123...)
    symbols: Symboles (!-;...)
    length: Longueur
    tokenPlaceholder: Le token...
    copied: Le token a été copié
    button:
      copy: Copier
      refresh: Rafraichir

  percentage-calculator:
    title: Calculateur de pourcentage
    description: Calculez facilement les pourcentages d'une valeur à une autre, ou d'un pourcentage à une valeur.

  svg-placeholder-generator:
    title: Générateur de placeholder SVG
    description: Générez des images SVG à utiliser comme placeholder dans vos applications.

  json-to-csv:
    title: JSON vers CSV
    description: Convertissez du JSON en CSV avec détection automatique des en-têtes.

  camera-recorder:
    title: Enregistreur de caméra
    description: Prenez une photo ou enregistrez une vidéo depuis votre webcam ou caméra.

  keycode-info:
    title: Info keycode
    description: Trouvez le keycode JavaScript, le code, l'emplacement et les modificateurs de toute touche pressée.

  emoji-picker:
    title: Sélecteur d'emoji
    description: Copiez et collez facilement des emojis et obtenez la valeur unicode et les points de code de chaque emoji.

  color-converter:
    title: Convertisseur de couleur
    description: Convertissez une couleur entre les différents formats (hex, rgb, hsl et nom CSS)

  bcrypt:
    title: Bcrypt
    description: Hachez et comparez des chaînes de texte en utilisant bcrypt. Bcrypt est une fonction de hachage de mot de passe basée sur le chiffrement Blowfish.

  crontab-generator:
    title: Générateur de crontab
    description: Validez et générez des crontab et obtenez une description lisible du planning cron.

  http-status-codes:
    title: Codes de statut HTTP
    description: La liste de tous les codes de statut HTTP, leur nom et leur signification.

  sql-prettify:
    title: SQL mise en forme et formatage
    description: Formatez et mettez en forme vos requêtes SQL en ligne (supporte différents dialectes SQL).

  benchmark-builder:
    title: Constructeur de benchmark
    description: Comparez facilement le temps d'exécution des tâches avec ce constructeur de benchmark en ligne très simple.

  git-memo:
    title: Aide-mémoire Git
    description: Git est un logiciel de gestion de version décentralisé. Avec cet aide-mémoire, vous aurez un accès rapide aux commandes git les plus courantes.

  slugify-string:
    title: Slugify de chaîne
    description: Rendez une chaîne compatible avec les URL, noms de fichiers et identifiants.

  encryption:
    title: Chiffrer / déchiffrer du texte
    description: Chiffrez du texte en clair et déchiffrez du texte chiffré en utilisant des algorithmes cryptographiques comme AES, TripleDES, Rabbit ou RC4.

  random-port-generator:
    title: Générateur de port aléatoire
    description: Générez des numéros de port aléatoires en dehors de la plage des ports « connus » (0-1023).

  yaml-prettify:
    title: YAML mise en forme et formatage
    description: Mettez en forme votre chaîne YAML dans un format lisible et convivial.

  eta-calculator:
    title: Calculateur d'ETA
    description: Un calculateur d'ETA (Estimated Time of Arrival) pour déterminer l'heure de fin approximative d'une tâche, par exemple, l'heure de fin et la durée d'un téléchargement de fichier.

  roman-numeral-converter:
    title: Convertisseur de chiffres romains
    description: Convertissez des chiffres romains en nombres et des nombres en chiffres romains.

  hmac-generator:
    title: Générateur HMAC
    description: Calcule un code d'authentification de message basé sur le hachage (HMAC) en utilisant une clé secrète et votre fonction de hachage préférée.

  bip39-generator:
    title: Générateur de phrase secrète BIP39
    description: Générez une phrase secrète BIP39 à partir d'un mnémonique existant ou aléatoire, ou obtenez le mnémonique à partir de la phrase secrète.

  base64-file-converter:
    title: Convertisseur de fichier Base64
    description: Convertissez une chaîne, un fichier ou une image en sa représentation base64.

  list-converter:
    title: Convertisseur de liste
    description: Cet outil peut traiter des données en colonnes et appliquer diverses modifications (transposer, ajouter un préfixe et un suffixe, inverser la liste, trier la liste, mettre en minuscules, tronquer les valeurs) à chaque ligne.

  base64-string-converter:
    title: Encodeur/décodeur de chaîne Base64
    description: Encodez et décodez simplement des chaînes en leur représentation base64.

  toml-to-yaml:
    title: TOML vers YAML
    description: Analysez et convertissez du TOML en YAML.

  math-evaluator:
    title: Évaluateur mathématique
    description: Une calculatrice pour évaluer des expressions mathématiques. Vous pouvez utiliser des fonctions comme sqrt, cos, sin, abs, etc.

  json-to-yaml-converter:
    title: Convertisseur JSON vers YAML
    description: Convertissez simplement du JSON en YAML avec ce convertisseur en ligne.

  url-parser:
    title: Analyseur d'URL
    description: Analysez une URL en ses parties constitutives (protocole, origine, paramètres, port, nom d'utilisateur-mot de passe, ...)

  iban-validator-and-parser:
    title: Validateur et analyseur d'IBAN
    description: Validez et analysez les numéros IBAN. Vérifiez si un IBAN est valide et obtenez le pays, le BBAN, s'il s'agit d'un QR-IBAN et le format IBAN convivial.

  user-agent-parser:
    title: Analyseur de user-agent
    description: Détectez et analysez le navigateur, le moteur, le système d'exploitation, le CPU et le type/modèle de l'appareil à partir d'une chaîne user-agent.

  numeronym-generator:
    title: Générateur de numéronyme
    description: Un numéronyme est un mot où un chiffre est utilisé pour former une abréviation. Par exemple, « i18n » est un numéronyme de « internationalization » où 18 représente le nombre de lettres entre le premier i et le dernier n du mot.

  case-converter:
    title: Convertisseur de casse
    description: Transformez la casse d'une chaîne et choisissez entre différents formats

  html-entities:
    title: Échapper les entités HTML
    description: Échappez ou annulez l'échappement des entités HTML (remplacez les caractères comme <,>, &, " et \' par leur version HTML)

  json-prettify:
    title: JSON mise en forme et formatage
    description: Mettez en forme votre chaîne JSON dans un format lisible et convivial.

  docker-run-to-docker-compose-converter:
    title: Docker run vers Docker compose
    description: Transformez les commandes « docker run » en fichiers docker-compose !

  mac-address-lookup:
    title: Recherche d'adresse MAC
    description: Trouvez le fournisseur et le fabricant d'un appareil par son adresse MAC.

  mime-types:
    title: Types MIME
    description: Convertissez les types MIME en extensions de fichier et vice-versa.

  toml-to-json:
    title: TOML vers JSON
    description: Analysez et convertissez du TOML en JSON.

  lorem-ipsum-generator:
    title: Générateur de Lorem ipsum
    description: Le Lorem ipsum est un texte de remplacement couramment utilisé pour démontrer la forme visuelle d'un document ou d'une police sans se fier à un contenu significatif

  qrcode-generator:
    title: Générateur de QR Code
    description: Générez et téléchargez un QR Code pour une URL (ou du texte brut), et personnalisez les couleurs de fond et de premier plan.

  wifi-qrcode-generator:
    title: Générateur de QR Code WiFi
    description: Générez et téléchargez des QR Codes pour une connexion rapide aux réseaux WiFi.

  xml-formatter:
    title: Formateur XML
    description: Mettez en forme votre chaîne XML dans un format lisible et convivial.

  temperature-converter:
    title: Convertisseur de température
    description: Conversions de température en degrés pour Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur et Rømer.

  chmod-calculator:
    title: Calculateur chmod
    description: Calculez vos permissions et commandes chmod avec ce calculateur chmod en ligne.

  rsa-key-pair-generator:
    title: Générateur de paire de clés RSA
    description: Générez une nouvelle paire de clés de certificat privée et publique RSA aléatoire au format PEM.

  html-wysiwyg-editor:
    title: Éditeur HTML WYSIWYG
    description: Éditeur HTML WYSIWYG en ligne et riche en fonctionnalités qui génère le code source du contenu immédiatement.

  yaml-to-toml:
    title: YAML vers TOML
    description: Analysez et convertissez du YAML en TOML.

  mac-address-generator:
    title: Générateur d'adresse MAC
    description: Entrez la quantité et le préfixe. Les adresses MAC seront générées dans la casse choisie (majuscules ou minuscules)

  json-diff:
    title: Diff JSON
    description: Comparez deux objets JSON et obtenez les différences entre eux.

  jwt-parser:
    title: Analyseur JWT
    description: Analysez et décodez votre JSON Web Token (JWT) et affichez son contenu.

  date-converter:
    title: Convertisseur date-heure
    description: Convertissez la date et l'heure dans les différents formats

  phone-parser-and-formatter:
    title: Analyseur et formateur de téléphone
    description: Analysez, validez et formatez les numéros de téléphone. Obtenez des informations sur le numéro de téléphone, comme l'indicatif pays, le type, etc.

  ipv4-subnet-calculator:
    title: Calculateur de sous-réseau IPv4
    description: Analysez vos blocs CIDR IPv4 et obtenez toutes les informations nécessaires sur votre sous-réseau.

  og-meta-generator:
    title: Générateur de meta Open Graph
    description: Générez des balises meta Open Graph et réseaux sociaux pour votre site web.

  ipv6-ula-generator:
    title: Générateur ULA IPv6
    description: Générez vos propres adresses IP locales non routables pour votre réseau selon la RFC4193.

  hash-text:
    title: Hachage de texte
    description: 'Hachez une chaîne de texte en utilisant la fonction dont vous avez besoin : MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 ou RIPEMD160'

  json-to-toml:
    title: JSON vers TOML
    description: Analysez et convertissez du JSON en TOML.

  device-information:
    title: Informations sur l'appareil
    description: Obtenez des informations sur votre appareil actuel (taille d'écran, ratio de pixels, user agent, ...)

  pdf-signature-checker:
    title: Vérificateur de signature PDF
    description: Vérifiez les signatures d'un fichier PDF. Un fichier PDF signé contient une ou plusieurs signatures qui peuvent être utilisées pour déterminer si le contenu du fichier a été modifié depuis la signature.

  json-minify:
    title: JSON minification
    description: Minifiez et compressez votre JSON en supprimant les espaces inutiles.

  ulid-generator:
    title: Générateur ULID
    description: Générez des identifiants ULID (Universally Unique Lexicographically Sortable Identifier) aléatoires.

  string-obfuscator:
    title: Obfuscateur de chaîne
    description: Obfusquez une chaîne (comme un secret, un IBAN ou un token) pour la rendre partageable et identifiable sans révéler son contenu.

  base-converter:
    title: Convertisseur de base d'entiers
    description: Convertissez un nombre entre différentes bases (décimal, hexadécimal, binaire, octal, base64, ...)

  yaml-to-json-converter:
    title: Convertisseur YAML vers JSON
    description: Convertissez simplement du YAML en JSON avec ce convertisseur en ligne.

  uuid-generator:
    title: Générateur d'UUID
    description: Un identifiant universel unique (UUID) est un nombre de 128 bits utilisé pour identifier des informations dans les systèmes informatiques. Le nombre d'UUID possibles est de 16^32, soit 2^128 ou environ 3,4x10^38 (ce qui énorme !).

  ipv4-address-converter:
    title: Convertisseur d'adresse IPv4
    description: Convertissez une adresse IP en décimal, binaire, hexadécimal, ou même en représentation IPv6.

  text-statistics:
    title: Statistiques de texte
    description: Obtenez des informations sur un texte, le nombre de caractères, le nombre de mots, sa taille en octets, ...

  text-to-nato-alphabet:
    title: Texte vers alphabet NATO
    description: Transformez du texte en alphabet phonétique NATO pour la transmission orale.

  basic-auth-generator:
    title: Générateur d'authentification basique
    description: Générez un en-tête d'authentification basique base64 à partir d'un nom d'utilisateur et d'un mot de passe.

  text-to-unicode:
    title: Texte vers Unicode
    description: Analysez et convertissez du texte en unicode et vice-versa

  ipv4-range-expander:
    title: Extenseur de plage IPv4
    description: Étant donné une adresse IPv4 de début et de fin, cet outil calcule un sous-réseau IPv4 valide ainsi que sa notation CIDR.

  text-diff:
    title: Diff de texte
    description: Comparez deux textes et voyez les différences entre eux.

  otp-generator:
    title: Générateur de code OTP
    description: Générez et validez des OTP (one time password) basés sur le temps pour l'authentification multi-facteurs.

  url-encoder:
    title: Encoder/décoder des chaînes URL
    description: Encodez du texte au format URL-encodé (également appelé « percent-encoded »), ou décodez à partir de ce format.

  text-to-binary:
    title: Texte vers binaire ASCII
    description: Convertissez du texte en sa représentation binaire ASCII et vice-versa.

  unix-timestamp-converter:
    title: Convertisseur de timestamp Unix
    description: Convertissez les timestamps Unix en dates lisibles et vice-versa. Supporte les secondes et les millisecondes.

  speed-test:
    title: Test de vitesse Internet
    description: Testez la vitesse de votre connexion Internet en ligne. Mesurez la vitesse de téléchargement, la vitesse d'envoi et la latence ping.

  dns-lookup:
    title: Recherche DNS
    description: Recherchez les enregistrements DNS de n'importe quel domaine. Vérifiez les enregistrements A, AAAA, MX, TXT, CNAME et NS en ligne.

  ssl-checker:
    title: Vérificateur de certificat SSL
    description: Vérifiez les détails du certificat SSL de n'importe quel site web. Vérifiez la validité du certificat, la date d'expiration et les informations de l'émetteur.

  website-checker:
    title: Vérificateur de disponibilité de site web
    description: Vérifiez si un site web est en panne ou en ligne. Testez la disponibilité du site web depuis plusieurs emplacements dans le monde entier.

  my-ip:
    title: Quelle est mon adresse IP
    description: Vérifiez votre adresse IP publique en ligne. Outil gratuit de recherche d'adresse IP affichant votre IP, votre emplacement et les informations de votre FAI.

