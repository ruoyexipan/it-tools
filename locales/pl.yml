aboutPage:
  content: >
    # O IT-Tools

    Ta wspaniała strona, stworzona z ❤ przez [Corentina Thomasseta](https://corentin.tech?utm_source=it-tools&utm_medium=about), agreguje przydatne narzędzia dla programistów i osób pracujących w IT. Jeśli uznasz ją za przydatną, śmiało udostępnij ją osobom, które mogą z niej skorzystać, i nie zapomnij dodać jej do zakładek!

    IT Tools jest open-source (na licencji GPL-3.0) i darmowy, i zawsze będzie, ale utrzymanie strony i odnowienie domeny kosztuje. Jeśli chcesz wesprzeć moją pracę i zachęcić mnie do dodawania kolejnych narzędzi, rozważ wsparcie poprzez [sponsorowanie mnie](https://www.buymeacoffee.com/cthmsst).

    ## Technologie

    IT Tools zostało stworzone w Vue.js (Vue 3) z biblioteką komponentów Naive UI i jest hostowane oraz ciągle wdrażane przez Vercel. W niektórych narzędziach używane są zewnętrzne biblioteki open-source — pełną listę można znaleźć w pliku [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) repozytorium.

    ## Znalazłeś błąd? Brakuje narzędzia?

    Jeśli potrzebujesz narzędzia, którego tutaj nie ma, a uważasz, że byłoby przydatne, zapraszamy do zgłoszenia prośby o nową funkcję w [sekcji issues](https://github.com/CorentinTh/it-tools/issues/new/choose) repozytorium na GitHubie.

    A jeśli znalazłeś błąd lub coś nie działa tak, jak powinno, zgłoś problem w [sekcji issues](https://github.com/CorentinTh/it-tools/issues/new/choose) repozytorium na GitHubie.

