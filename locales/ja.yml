aboutPage:
  content: >
    # IT-Toolsについて

    この素晴らしいウェブサイトは、[Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) が❤を込めて制作しました。開発者やIT関係者に役立つツールを集約しています。便利だと思ったら、ぜひ共有してください。ブックマークもお忘れなく！

    IT ToolsはGPL-3.0ライセンスのオープンソースで、無料で提供されており、今後も無料の予定です。ただし、ホスティングとドメイン更新にはコストがかかります。私の活動を支援し、さらなるツール追加を後押ししたい場合は、[スポンサーになる](https://www.buymeacoffee.com/cthmsst)ことをご検討ください。

    ## 使用技術

    IT ToolsはVue.js（Vue 3）とNaive UIコンポーネントライブラリで構築されており、Vercelによりホスティング・継続的デプロイが行われています。一部のツールではサードパーティのオープンソースライブラリを使用しています。詳細はリポジトリの[package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json)をご覧ください。

    ## バグを見つけましたか？ツールの追加希望は？

    現在ないツールで便利そうなものがあれば、GitHubリポジトリの[Issuesセクション](https://github.com/CorentinTh/it-tools/issues/new/choose)で機能リクエストを送信してください。

    バグや予期しない動作を見つけた場合は、同様に[Issuesセクション](https://github.com/CorentinTh/it-tools/issues/new/choose)でバグ報告をお願いします。

