aboutPage:
  content: >
    # IT-Tools 소개

    이 멋진 웹사이트는 [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about)가 ❤으로 만들었으며, 개발자와 IT 종사자에게 유용한 도구를 모아놓았습니다. 유용하다고 생각하시면 주변에 공유해주시고, 즐겨찾기에 추가해두시면 편리합니다!

    IT Tools는 GPL-3.0 라이선스 하에 오픈 소스로 제공되며 무료입니다. 앞으로도 무료로 유지할 예정이지만, 호스팅 및 도메인 비용이 발생합니다. 제 작업을 지원하고 더 많은 도구 추가를 응원하고 싶으시다면 [후원하기](https://www.buymeacoffee.com/cthmsst)를 고려해주세요.

    ## 기술 스택

    IT Tools는 Vue.js (Vue 3)와 Naive UI 컴포넌트 라이브러리로 제작되었으며, Vercel에서 호스팅 및 지속적 배포가 이루어집니다. 일부 도구에서는 서드파티 오픈 소스 라이브러리를 사용하며, 전체 목록은 저장소의 [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) 파일에서 확인할 수 있습니다.

    ## 버그를 발견하셨나요? 도구가 빠졌나요?

    현재 없는 도구가 필요하시거나 유용할 것 같다고 생각되신다면, GitHub 저장소의 [이슈 섹션](https://github.com/CorentinTh/it-tools/issues/new/choose)에서 기능 요청을 제출해주세요.

    버그를 발견하셨거나 예상대로 작동하지 않는 경우, GitHub 저장소의 [이슈 섹션](https://github.com/CorentinTh/it-tools/issues/new/choose)에서 버그 리포트를 제출해주세요.

