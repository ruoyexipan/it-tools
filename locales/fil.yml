    description: Simpleng i-convert ang YAML patungong JSON gamit ang online live converter na ito.

  uuid-generator:
    title: UUIDs generator
    description: Ang Universally Unique Identifier (UUID) ay isang 128-bit na numero na ginagamit para makilala ang impormasyon sa mga computer system. Ang bilang ng mga posibleng UUID ay 16^32, na kung saan ay 2^128 o mga 3.4x10^38 (na kung saan ay napakarami!).

  ipv4-address-converter:
    title: IPv4 address converter
    description: I-convert ang IP address sa decimal, binary, hexadecimal, o kahit IPv6 representation nito.

  text-statistics:
    title: Estadistika ng teksto
