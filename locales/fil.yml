    description: Baguhin ang teksto sa NATO phonetic alphabet para sa oral na paghahatid.

  basic-auth-generator:
    title: Basic auth generator
    description: Bumuo ng base64 basic auth header mula sa username at password.

  text-to-unicode:
    title: Teksto patungong Unicode
    description: I-parse at i-convert ang teksto sa unicode at vice-versa

  ipv4-range-expander:
    title: IPv4 range expander
    description: Binibigyan ng simula at katapusan ng IPv4 address, kinakalkula ng tool na ito ang wastong IPv4 subnet kasama ang CIDR notation nito.

  text-diff:
    title: Text diff
    description: Ihambing ang dalawang teksto at tingnan ang mga pagkakaiba sa pagitan nila.

  otp-generator:
    title: OTP code generator
    description: Bumuo at i-validate ang time-based na OTP (one time password) para sa multi-factor authentication.

  url-encoder:
    title: I-encode/i-decode ang URL-formatted na mga string
    description: I-encode ang teksto sa URL-encoded format (kilala rin bilang "percent-encoded"), o i-decode mula rito.

  text-to-binary:
    title: Teksto patungong ASCII binary
    description: I-convert ang teksto sa ASCII binary representation nito at vice-versa.

  unix-timestamp-converter:
    title: Unix timestamp converter
    description: I-convert ang mga Unix timestamp sa nababasa ng tao na mga petsa at vice versa. Sinusuportahan ang mga segundo at millisecond.

  speed-test:
    title: Speed test ng internet
    description: Subukan ang bilis ng iyong internet connection online. Sukatin ang bilis ng download, bilis ng upload, at ping latency.

  dns-lookup:
    title: DNS lookup
    description: Mag-lookup ng DNS records para sa anumang domain. Suriin ang A, AAAA, MX, TXT, CNAME, at NS records online.

  ssl-checker:
    title: SSL certificate checker
    description: Suriin ang mga detalye ng SSL certificate para sa anumang website. I-verify ang bisa ng certificate, petsa ng pag-expire, at impormasyon ng issuer.

  website-checker:
    title: Website down checker
    description: Suriin kung ang website ay down o up. Subukan ang availability ng website mula sa maraming lokasyon sa buong mundo.

  my-ip:
    title: Ano ang aking IP address
    description: Suriin ang iyong public IP address online. Libreng IP address lookup tool na nagpapakita ng iyong IP, lokasyon, at impormasyon ng ISP.

