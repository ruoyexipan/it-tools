  git-memo:
    title: Git cheatsheet
    description: Ang Git ay isang decentralized na software sa pamamahala ng bersyon. Gamit ang cheatsheet na ito, magkakaroon ka ng mabilis na access sa mga pinakakaraniwang git command.

