  iban-validator-and-parser:
    title: IBAN validator at parser
    description: I-validate at i-parse ang mga IBAN number. Suriin kung ang IBAN ay wasto at makuha ang bansa, BBAN, kung ito ay QR-IBAN at ang IBAN friendly format.

  user-agent-parser:
    title: User-agent parser
    description: Tuklasin at i-parse ang Browser, Engine, OS, CPU, at Device type/model mula sa user-agent string.

  numeronym-generator:
