aboutPage:
  content: >
    # Tungkol sa IT-Tools

    Ang kamangha-manghang website na ito, ginawa ng may ❤ ni [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), ay nagsasama-sama ng mga kapakipakinabang na tool para sa mga developer at mga taong nagtatrabaho sa IT. Kung nakikita mong kapaki-pakinabang ito, mangyaring huwag mag-atubiling ibahagi ito sa mga taong sa palagay mo ay makikita rin itong kapaki-pakinabang at huwag kalimutang i-bookmark ito sa iyong shortcut bar!

    Ang IT Tools ay open-source (sa ilalim ng GPL-3.0 license) at libre, at palaging magiging libre, ngunit may gastos sa akin ang pag-host at pag-renew ng domain name. Kung gusto mong suportahan ang aking trabaho, at hikayatin akong magdagdag ng mas maraming tool, mangyaring isaalang-alang ang pagsuporta sa pamamagitan ng [pagsponsor sa akin](https://www.buymeacoffee.com/cthmsst).

    ## Mga Teknolohiya

    Ang IT Tools ay ginawa gamit ang Vue.js (Vue 3) na may Naive UI component library at naka-host at patuloy na naka-deploy ng Vercel. Ang mga third-party na open-source library ay ginagamit sa ilang tool, maaari mong makita ang kumpletong listahan sa [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) file ng repository.

    ## Nakakita ng bug? May nawawalang tool?

    Kung kailangan mo ng tool na kasalukuyang wala rito, at sa tingin mo ay maaaring kapaki-pakinabang, malugod kang tinatanggap na magsumite ng feature request sa [issues section](https://github.com/CorentinTh/it-tools/issues/new/choose) sa GitHub repository.

    At kung nakakita ka ng bug, o may hindi gumagana ayon sa inaasahan, mangyaring mag-file ng bug report sa [issues section](https://github.com/CorentinTh/it-tools/issues/new/choose) sa GitHub repository.

