    title: Slugify string
    description: Gawing ligtas sa url, filename at id ang isang string.

  encryption:
    title: I-encrypt / i-decrypt ang teksto
    description: I-encrypt ang malinaw na teksto at i-decrypt ang ciphertext gamit ang mga crypto algorithm tulad ng AES, TripleDES, Rabbit o RC4.

